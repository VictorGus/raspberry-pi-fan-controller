<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrow-rev" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L10,6 L1,3 z" fill="#2b2b2b"/>
    </marker>
    <style>
      .box       { fill: #fdfdfd; stroke: #2b2b2b; stroke-width: 2; }
      .box-title { font-size: 18px; font-weight: 600; fill: #1a1a1a; }
      .box-sub   { font-size: 13px; fill: #555; }
      .arrow     { stroke: #2b2b2b; stroke-width: 2; fill: none; }
      .lbl       { font-size: 14px; fill: #333; }
      .lbl-sub   { font-size: 12px; fill: #777; }
    </style>
  </defs>

  <!-- gui -->
  <rect x="40" y="110" width="160" height="110" rx="10" class="box"/>
  <text x="120" y="150" text-anchor="middle" class="box-title">gui</text>
  <text x="120" y="180" text-anchor="middle" class="box-sub">(GTK 3)</text>

  <!-- fanctld -->
  <rect x="330" y="110" width="160" height="110" rx="10" class="box"/>
  <text x="410" y="150" text-anchor="middle" class="box-title">fanctld</text>
  <text x="410" y="180" text-anchor="middle" class="box-sub">(демон)</text>

  <!-- вентилятор -->
  <rect x="620" y="110" width="160" height="110" rx="10" class="box"/>
  <text x="700" y="170" text-anchor="middle" class="box-title">вентилятор</text>

  <!-- gui <-> fanctld -->
  <line x1="200" y1="165" x2="330" y2="165" class="arrow"
        marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
  <text x="265" y="155" text-anchor="middle" class="lbl">Unix-сокет</text>

  <!-- fanctld -> вентилятор -->
  <line x1="490" y1="165" x2="620" y2="165" class="arrow" marker-end="url(#arrow)"/>
  <text x="555" y="155" text-anchor="middle" class="lbl">GPIO</text>
  <text x="555" y="183" text-anchor="middle" class="lbl-sub">libgpiod</text>

  <!-- config file -->
  <rect x="290" y="300" width="240" height="60" rx="10" class="box"/>
  <text x="410" y="338" text-anchor="middle" class="box-title">~/.config/fanctld.conf</text>

  <!-- fanctld -> config -->
  <line x1="410" y1="220" x2="410" y2="300" class="arrow" marker-end="url(#arrow)"/>
</svg>
